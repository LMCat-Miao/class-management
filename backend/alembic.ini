# Alembic config. Run from the backend directory:
#   python -m alembic revision --autogenerate -m "msg"
#   python -m alembic upgrade head
#
# NOTE: Keep this file ASCII-only. On Windows, Alembic reads it with the
# system locale encoding and non-ASCII comments can break parsing.

[alembic]
script_location = alembic
prepend_sys_path = .

# Real DB URL is injected in alembic/env.py from Settings (.env).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
